name: SDK Compliance Check (Big Pickle)

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [ops/compliance]
  pull_request:
    branches: [ops/compliance]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compliance-check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout workflow branch (ops/compliance)
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Checkout SDK source (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: sdk

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: ci/tools/check-compliance/go.mod

      - name: Run compliance checker
        id: check
        continue-on-error: true
        run: |
          cd ci/tools/check-compliance
          go run main.go -sdk "${{ github.workspace }}/sdk" 2>&1 | tee /tmp/compliance-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Report results
        run: |
          echo "## Compliance Check Results" > $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/compliance-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Exit code: ${{ steps.check.outputs.exit_code }}" >> $GITHUB_STEP_SUMMARY

      - name: Create/update issue on failure
        if: steps.check.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="## ⚠️ SDK Compliance Issues Detected\n\n"
          BODY+="The Big Pickle compliance checker has detected differences between the SDK implementation and the official Duitku POP documentation.\n\n"
          BODY+="### Details\n\n"
          BODY+="\`\`\`\n"
          BODY+="$(cat /tmp/compliance-output.txt)\n"
          BODY+="\`\`\`\n\n"
          BODY+="### Next Steps\n"
          BODY+="1. Review the official documentation at https://docs.duitku.com/pop/id/#integrasi-backend-atau-server\n"
          BODY+="2. Update the SDK implementation to match the documented API\n"
          BODY+="3. Close this issue once the discrepancy is resolved\n\n"
          BODY+="---\n"
          BODY+="_This issue was automatically generated by the SDK Compliance Check workflow._"

          EXISTING=$(gh issue list \
            --label "compliance" \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "null")

          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" \
              --body "Re-checked on $(date -u '+%Y-%m-%d %H:%M UTC'): still failing."
            echo "Updated existing issue #$EXISTING"
          else
            gh issue create \
              --title "SDK Compliance Check failed on $(date -u '+%Y-%m-%d')" \
              --label "compliance" \
              --body "$(echo -e "$BODY")"
          fi

      - name: Close issue on success
        if: steps.check.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list \
            --label "compliance" \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "null")
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue close "$EXISTING" \
              --comment "✅ Compliance check passed. All SDK fields match the official documentation."
            echo "Closed issue #$EXISTING"
          fi
