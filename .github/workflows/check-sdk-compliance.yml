name: SDK Compliance Check (Big Pickle)

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [ops/compliance]
  pull_request:
    branches: [ops/compliance]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compliance-check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout workflow branch (ops/compliance)
        uses: actions/checkout@v4

      - name: Checkout SDK source (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: sdk

      - name: Install opencode
        run: npm install -g opencode-ai

      - name: Run compliance check with opencode
        id: check
        continue-on-error: true
        run: |
          cat > /tmp/compliance-prompt.md << 'PROMPT'
          Read all Go source files in the sdk directory (all *.go excluding *_test.go).
          Fetch the official Duitku POP API docs from https://docs.duitku.com/pop/id/.
          Compare the SDK source against the docs.

          Sections to check:
          A. CreateInvoice API:
             - Endpoint: POST /api/merchant/createInvoice
             - Headers: Content-Type, x-duitku-timestamp, x-duitku-signature, x-duitku-merchantcode
             - Signature: stringToSign = merchantCode + timestamp, HMAC-SHA256, hex output
             - Required request fields: paymentAmount(int64), merchantOrderId(string), productDetails(string), email(string), callbackUrl(string), returnUrl(string)
             - Optional request fields: additionalParam, merchantUserInfo, customerVaName, phoneNumber, itemDetails([]ItemDetail), customerDetail(*CustomerDetail), creditCardDetail(*CreditCardDetail), expiryPeriod(int), paymentMethod(string)
             - Response fields: merchantCode, reference, paymentUrl, statusCode, statusMessage
          B. Callback:
             - 26 fields: merchantCode, amount(int64), merchantOrderId, productDetail, additionalParam, paymentCode, resultCode, merchantUserId, reference, signature, publisherOrderId, spUserHash, settlementDate, issuerCode, bankAppCode, bankOrderId, bankRespCode, bankRespMsg, cardName, cardType, maskedNumber, tokenId, transactionState, transactionStateStatus, merchantCustomerId, expiryDate
             - Signature: merchantCode + amount + merchantOrderId, HMAC-SHA256, constant-time comparison
          C. Sub-objects:
             - ItemDetail: name(string), price(int64), quantity(int)
             - CustomerDetail: firstName, lastName, email, phoneNumber, billingAddress(*Address), shippingAddress(*Address), merchantCustomerId
             - Address: firstName, lastName, address, city, postalCode, phone, countryCode
             - CreditCardDetail: saveCardToken(int), acquirer(string), binWhitelist([]string)

          Output first line: PASS if fully compliant, FAIL if any issue found.
          If FAIL, list each issue after the first line, one per line starting with '- '.
          Include the source file name and field name for each issue.
          Check: field names, JSON tags, form tags, Go types, omitempty on optional fields, and signature algorithms.
          PROMPT

          opencode run "$(cat /tmp/compliance-prompt.md)" 2>&1 | tee /tmp/compliance-raw.txt
          sed 's/\x1b\[[0-9;]*m//g' /tmp/compliance-raw.txt | tee /tmp/compliance-output.txt
          grep -q "^PASS$" /tmp/compliance-output.txt && echo "result=PASS" >> $GITHUB_OUTPUT || echo "result=FAIL" >> $GITHUB_OUTPUT

      - name: Report results
        run: |
          echo "## OpenCode Compliance Check Results" > $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/compliance-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Ensure compliance label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create compliance --color FBCA04 --description "SDK compliance check results" 2>/dev/null || true

      - name: Create/update issue on failure
        if: steps.check.outputs.result == 'FAIL'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="## ⚠️ SDK Compliance Issues Detected\n\n"
          BODY+="OpenCode has detected differences between the SDK implementation and the official Duitku POP documentation.\n\n"
          BODY+="### Details\n\n"
          BODY+="\`\`\`\n"
          BODY+="$(cat /tmp/compliance-output.txt)\n"
          BODY+="\`\`\`\n\n"
          BODY+="### Next Steps\n"
          BODY+="1. Review the official documentation at https://docs.duitku.com/pop/id/#integrasi-backend-atau-server\n"
          BODY+="2. Update the SDK implementation to match the documented API\n"
          BODY+="3. Close this issue once the discrepancy is resolved\n\n"
          BODY+="---\n"
          BODY+="_This issue was automatically generated by the SDK Compliance Check workflow._"

          EXISTING=$(gh issue list \
            --label "compliance" \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "null")

          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" \
              --body "Re-checked on $(date -u '+%Y-%m-%d %H:%M UTC'): still failing."
            echo "Updated existing issue #$EXISTING"
          else
            gh issue create \
              --title "SDK Compliance Check failed on $(date -u '+%Y-%m-%d')" \
              --label "compliance" \
              --body "$(echo -e "$BODY")"
          fi

      - name: Close issue on success
        if: steps.check.outputs.result == 'PASS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list \
            --label "compliance" \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "null")
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue close "$EXISTING" \
              --comment "✅ Compliance check passed. All SDK fields match the official documentation."
            echo "Closed issue #$EXISTING"
          fi
