name: SDK Compliance Check (Big Pickle)

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [ops/compliance]
  pull_request:
    branches: [ops/compliance]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compliance-check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout workflow branch (ops/compliance)
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Checkout SDK source (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: sdk

      - name: Install opencode
        run: |
          npm install -g @anthropic-ai/opencode

      - name: Run compliance check with opencode
        id: check
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cat > /tmp/compliance-prompt.md << 'PROMPT'
          You are a strict API compliance checker for the Duitku POP Go SDK.

          ## Task
          1. Fetch the official documentation from https://docs.duitku.com/pop/id/
          2. Read all Go source files in ${{ github.workspace }}/sdk/ (duitku.go, invoice.go, callback.go, models.go, signature.go)
          3. Compare the SDK implementation against the official documentation
          4. Report any differences or issues found

          ## Sections to check

          ### A. CreateInvoice API
          - Endpoint: POST /api/merchant/createInvoice
          - Base URLs: sandbox (api-sandbox.duitku.com) and production (api-prod.duitku.com)
          - Request headers: Content-Type, x-duitku-timestamp, x-duitku-signature, x-duitku-merchantcode
          - Signature: stringToSign = merchantCode + timestamp, HMAC_SHA256(stringToSign, apiKey)
          - Request fields: paymentAmount (int64, required), merchantOrderId (string, required), productDetails (string, required), email (string, required), callbackUrl (string, required), returnUrl (string, required), plus optional fields (additionalParam, merchantUserInfo, customerVaName, phoneNumber, itemDetails, customerDetail, creditCardDetail, expiryPeriod, paymentMethod)
          - Response fields: merchantCode, reference, paymentUrl, statusCode, statusMessage

          ### B. Callback
          - 26 fields total (merchantCode, amount, merchantOrderId, productDetail, additionalParam, paymentCode, resultCode, merchantUserId, reference, signature, publisherOrderId, spUserHash, settlementDate, issuerCode, bankAppCode, bankOrderId, bankRespCode, bankRespMsg, cardName, cardType, maskedNumber, tokenId, transactionState, transactionStateStatus, merchantCustomerId, expiryDate)
          - Callback signature: stringToSign = merchantCode + amount + merchantOrderId, HMAC SHA256
          - Must use constant-time comparison (hmac.Equal)

          ### C. Sub-objects
          - ItemDetail: name (string), price (int64), quantity (int)
          - CustomerDetail: firstName, lastName, email, phoneNumber, billingAddress (*Address), shippingAddress (*Address), merchantCustomerId
          - Address: firstName, lastName, address, city, postalCode, phone, countryCode
          - CreditCardDetail: saveCardToken (int), acquirer (string), binWhitelist ([]string)

          ## Output format
          First line: either "PASS" or "FAIL"
          If FAIL, list each issue on a separate line starting with "- "
          Include the file name and line if relevant.

          Be thorough. Check every field name, JSON tag, form tag, type, and omitempty.
          PROMPT

          opencode -p "$(cat /tmp/compliance-prompt.md)" 2>&1 | tee /tmp/compliance-output.txt
          echo "result=$(head -1 /tmp/compliance-output.txt)" >> $GITHUB_OUTPUT

      - name: Report results
        run: |
          echo "## OpenCode Compliance Check Results" > $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/compliance-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Create/update issue on failure
        if: steps.check.outputs.result == 'FAIL'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="## ⚠️ SDK Compliance Issues Detected\n\n"
          BODY+="OpenCode has detected differences between the SDK implementation and the official Duitku POP documentation.\n\n"
          BODY+="### Details\n\n"
          BODY+="\`\`\`\n"
          BODY+="$(cat /tmp/compliance-output.txt)\n"
          BODY+="\`\`\`\n\n"
          BODY+="### Next Steps\n"
          BODY+="1. Review the official documentation at https://docs.duitku.com/pop/id/#integrasi-backend-atau-server\n"
          BODY+="2. Update the SDK implementation to match the documented API\n"
          BODY+="3. Close this issue once the discrepancy is resolved\n\n"
          BODY+="---\n"
          BODY+="_This issue was automatically generated by the SDK Compliance Check workflow._"

          EXISTING=$(gh issue list \
            --label "compliance" \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "null")

          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" \
              --body "Re-checked on $(date -u '+%Y-%m-%d %H:%M UTC'): still failing."
            echo "Updated existing issue #$EXISTING"
          else
            gh issue create \
              --title "SDK Compliance Check failed on $(date -u '+%Y-%m-%d')" \
              --label "compliance" \
              --body "$(echo -e "$BODY")"
          fi

      - name: Close issue on success
        if: steps.check.outputs.result == 'PASS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list \
            --label "compliance" \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "null")
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue close "$EXISTING" \
              --comment "✅ Compliance check passed. All SDK fields match the official documentation."
            echo "Closed issue #$EXISTING"
          fi
